name: Issue gate tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  issue-gate-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Unit, CLI, trusted receipt and head check contracts
        working-directory: tools/issue-lifecycle
        run: python3 -m unittest discover -s tests -v
