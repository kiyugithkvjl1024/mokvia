<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="230" viewBox="0 0 1120 230" role="img" aria-labelledby="title desc"><title id="title">mokviaの最初の一巡</title><desc id="desc">気になったことをInboxに集め、次の行動を決め、今日やるに置き、開始して完了する。後で見直す。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#426d58"/></marker></defs><rect width="1120" height="230" rx="16" fill="#f3f7f2"/><g font-family="Noto Sans CJK JP, Yu Gothic, sans-serif" fill="#213f30"><text x="26" y="36" font-size="22" font-weight="700">頭の中から出す → 次に何をするか決める → 一つ進める</text><g fill="white" stroke="#95b8a3"><rect x="25" y="65" width="236" height="107" rx="12"/><rect x="303" y="65" width="236" height="107" rx="12"/><rect x="581" y="65" width="236" height="107" rx="12"/><rect x="859" y="65" width="236" height="107" rx="12"/></g><g font-size="23" font-weight="700"><text x="45" y="100">1. Inboxへ入れる</text><text x="323" y="100">2. 次にやるを決める</text><text x="601" y="100">3. 今日やるで開始</text><text x="879" y="100">4. 完了して見直す</text></g><g font-size="19"><text x="45" y="139">思いつきも依頼もメモ</text><text x="323" y="139">一つの具体的な行動に</text><text x="601" y="139">期限と取り組む日は別</text><text x="879" y="139">記録を残し、次を選ぶ</text></g><g stroke="#426d58" stroke-width="3" marker-end="url(#a)"><path d="M267 119H295"/><path d="M545 119H573"/><path d="M823 119H851"/></g><text x="28" y="206" font-size="18">最初は手入力のTask一つで十分です。ProjectやOutlook・Teams連携は、必要になったら。</text></g></svg>
